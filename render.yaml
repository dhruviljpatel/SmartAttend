services:
  # 1. Backend Web Service (Node.js / Express)
  - type: web
    name: smartattend-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartattend-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: smartattend-ml
          property: host
      - key: NODE_ENV
        value: production

  # 2. Python ML Microservice (FastAPI + dlib via Docker)
  - type: web
    name: smartattend-ml
    runtime: docker
    rootDir: ml
    dockerfilePath: Dockerfile
    envVars:
      - key: RESEMBLANCE_THRESHOLD
        value: "0.6"
      - key: BACKEND_URL
        fromService:
          type: web
          name: smartattend-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: smartattend-db
    databaseName: smartattend
    user: admin

